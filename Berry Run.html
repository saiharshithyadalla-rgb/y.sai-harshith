<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berry Run</title>
<style>
:root{--bg:#eef3e2;--ink:#2b2622;--card:#fbfff0;--accent:#d3342b;--muted:#6b7560;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a2018;--ink:#eef3e2;--card:#252d22;--accent:#ff5a4d;--muted:#9fae96;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a2018;--ink:#eef3e2;--card:#252d22;--accent:#ff5a4d;--muted:#9fae96;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
h1{margin:0;font-size:clamp(22px,5vw,32px)}
.wrap{width:min(96vw,720px)}
canvas{width:100%;display:block;border-radius:12px;border:2px solid var(--ink);touch-action:none;background:#bfe6a0}
.hud{width:min(96vw,720px);display:flex;justify-content:space-between;gap:8px;font-weight:bold}
.hud span{background:var(--card);padding:6px 12px;border-radius:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
button,label.btn{font:inherit;font-weight:bold;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
button.alt,label.btn{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--ink);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.hint{font-size:13px;color:var(--muted);text-align:center;max-width:480px;margin:0;line-height:1.4}
</style>
</head>
<body>
<h1>Berry Run</h1>
<div class="hud"><span id="sc">Score 0</span><span id="bs">Best 0</span></div>
<div class="wrap"><canvas id="c" width="720" height="240" aria-label="Endless runner game"></canvas></div>
<div class="row">
  <button id="jump">Jump</button>
  <button id="duck" class="alt">Duck</button>
  <button id="mt" class="alt" aria-pressed="true">Music: on</button>
  <label class="btn">Load my own music<input type="file" id="mf" accept="audio/*"></label>
</div>
<p class="hint">Space, ↑ or tap to jump. Hold ↓ to duck under flying heads. The built-in music is an original synth loop. To play a song you own, use Load my own music; it plays from your device only.</p>

var st='idle',pl,obs,speed,dist,t,spawn,clouds,duck=false,last;
function reset(){pl={x:60,y:GY,vy:0,air:false};obs=[];speed=6;dist=0;t=0;spawn=60;clouds=[{x:200,y:40},{x:480,y:70},{x:680,y:30}]}
function jump(){audioOn();if(st==='idle'||st==='over'){reset();st='play';play();return}
 if(pl.air||duck)return;pl.vy=-13.5;pl.air=true}
function runner(){
 var x=pl.x,y=pl.y,ph=pl.air?0:Math.sin(t*.5)*6,d=duck&&!pl.air;
 g.fillStyle='#7a4a2a';
 if(!d){g.fillRect(x+6,y-14,9,14+ph/2);g.fillRect(x+25,y-14,9,14-ph/2)}
 else{g.fillRect(x+4,y-8,8,8+ph/3);g.fillRect(x+30,y-8,8,8-ph/3)}
 var bh=d?24:36,by=d?y-30:y-48;
 g.fillStyle='#d3342b';g.beginPath();g.ellipse(x+20,by+bh/2,23,bh/2+3,0,0,7);g.fill();
 g.fillStyle='#ffe28a';for(var i=0;i<7;i++){g.fillRect(x+6+(i%4)*9+(i>3?4:0),by+6+(i>3?12:0)*(d?.5:1),3,4)}
 g.fillStyle='#3f9a3a';g.beginPath();g.moveTo(x+6,by+2);g.lineTo(x+20,by-5);g.lineTo(x+34,by+2);g.lineTo(x+20,by+8);g.fill();
 g.fillStyle='#e8a77a';g.fillRect(x-6,by+10+ph/3,8,7);g.fillRect(x+38,by+10-ph/3,8,7);
 var hw=d?27:34,hh=d?38:48,hx=x+20-hw/2+(d?8:0),hy=by-hh+10;
 g.drawImage(hero,hx,hy,hw,hh);
}
function foeHead(x,y,w,h){g.drawImage(foe,x,y,w,h)}
function drawObs(o){
 if(o.k==='g'){
  for(var i=0;i<o.n;i++){var x=o.x+i*40;
   g.fillStyle='#f6f2ea';g.fillRect(x,o.y+o.hh-6,38,o.h-o.hh+6);g.strokeStyle='#2b2622';g.lineWidth=2;g.strokeRect(x,o.y+o.hh-6,38,o.h-o.hh+6);
   g.fillStyle='#2b2622';g.fillRect(x+4,o.y+o.hh-6,3,o.h-o.hh+6);
   foeHead(x+1,o.y,36,o.hh)}
 }else{
  var f=(t>>3)%2;g.fillStyle='#fff';g.strokeStyle='#2b2622';g.lineWidth=2;
  g.beginPath();g.moveTo(o.x+6,o.y+26);g.lineTo(o.x-12,o.y+(f?6:42));g.lineTo(o.x+14,o.y+30);g.fill();g.stroke();
  g.beginPath();g.moveTo(o.x+30,o.y+26);g.lineTo(o.x+48,o.y+(f?6:42));g.lineTo(o.x+22,o.y+30);g.fill();g.stroke();
  foeHead(o.x,o.y,36,48)}
}
function pbox(){return duck&&!pl.air?{x:pl.x,y:pl.y-40,w:54,h:40}:{x:pl.x+4,y:pl.y-84,w:32,h:84}}
function obox(o){return o.k==='g'?{x:o.x+4,y:o.y+6,w:o.n*40-10,h:o.h-6}:{x:o.x+2,y:o.y+4,w:32,h:36}}
function update(dt){
 t+=dt;speed=6+Math.min(dist/400,7);dist+=speed*dt*.08;
 if(pl.air){pl.vy+=.7*dt;pl.y+=pl.vy*dt;if(pl.y>=GY){pl.y=GY;pl.vy=0;pl.air=false}}
 spawn-=speed*dt;
 if(spawn<=0){
  if(dist>60&&Math.random()<.3)obs.push({k:'a',x:W+20,y:Math.random()<.5?GY-92:GY-140,h:48});
  else{var n=Math.random()<.3?2:1,hh=44+Math.random()*10;obs.push({k:'g',n:n,x:W+20,hh:hh,h:hh+26,y:GY-hh-26})}
  spawn=Math.max(220,430-dist*.8)+Math.random()*260}
 for(var i=obs.length-1;i>=0;i--){var o=obs[i];o.x-=speed*dt;if(o.x<-120){obs.splice(i,1);continue}
  var b=pbox(),q=obox(o);
  if(b.x<q.x+q.w&&b.x+b.w>q.x&&b.y<q.y+q.h&&b.y+b.h>q.y){over();return}}
 for(var c=0;c<clouds.length;c++){clouds[c].x-=speed*.2*dt;if(clouds[c].x<-60){clouds[c].x=W+40;clouds[c].y=20+Math.random()*60}}
}
function over(){st='over';stopM();var s=dist|0;if(s>best){best=s;try{localStorage.setItem('berryrun-best',best)}catch(e){}}bs.textContent='Best '+best}
function draw(){
 var sk=g.createLinearGradient(0,0,0,GY);sk.addColorStop(0,'#bfe6f5');sk.addColorStop(1,'#eaf7d8');g.fillStyle=sk;g.fillRect(0,0,W,GY);
 g.fillStyle='rgba(255,255,255,.85)';for(var c=0;c<clouds.length;c++){var q=clouds[c];g.fillRect(q.x,q.y,56,12);g.fillRect(q.x+10,q.y-8,30,10)}
 g.fillStyle='#8a5a2c';var fo=(t*speed*.5)%60;for(var x=-fo;x<W;x+=60){g.fillRect(x,GY-34,6,34);g.fillRect(x+30,GY-34,6,34)}g.fillRect(0,GY-26,W,5);g.fillRect(0,GY-14,W,5);
 g.fillStyle='#5db84a';g.fillRect(0,GY,W,H-GY);g.fillStyle='#4aa23a';g.fillRect(0,GY,W,4);
 g.fillStyle='#3f8f33';for(var i=0;i<14;i++){g.fillRect(((i*67-t*speed*.6)%W+W)%W,GY+14+(i%3)*10,12+(i%4)*4,3)}
 for(var j=0;j<obs.length;j++)drawObs(obs[j]);
 runner();sc.textContent='Score '+(dist|0);
 if(st!=='play'){g.fillStyle='rgba(43,38,34,.8)';g.fillRect(170,66,380,96);g.fillStyle='#fffaf0';g.textAlign='center';
  g.font='bold 26px Trebuchet MS,sans-serif';g.fillText(st==='over'?'Game over':'Berry Run',360,104);
  g.font='16px Trebuchet MS,sans-serif';g.fillText(st==='over'?'Score '+(dist|0)+'. Press Space or tap to retry':'Press Space or tap to start',360,136)}
}
function loop(ts){var dt=Math.min((ts-last)/16.67,3)||1;last=ts;if(st==='play')update(dt);draw();requestAnimationFrame(loop)}
/* music: original synth loop, or the person's own file */
var ac=null,tm=null,step=0,nxt=0,mOn=true,own=null,noise=null;
var BASS=[55,0,55,0,65.4,0,55,0,73.4,0,55,0,65.4,0,82.4,0],LEAD=[440,0,523,0,659,523,0,587,523,0,440,0,392,0,440,523];
function audioOn(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}if(ac.state==='suspended')ac.resume()}
function tone(f,t0,d,type,v){var o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(v,t0);a.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(a);a.connect(ac.destination);o.start(t0);o.stop(t0+d)}
function kick(t0){var o=ac.createOscillator(),a=ac.createGain();o.frequency.setValueAtTime(150,t0);o.frequency.exponentialRampToValueAtTime(40,t0+.12);a.gain.setValueAtTime(.5,t0);a.gain.exponentialRampToValueAtTime(.001,t0+.15);o.connect(a);a.connect(ac.destination);o.start(t0);o.stop(t0+.16)}
function hat(t0){if(!noise){noise=ac.createBuffer(1,2205,44100);var d=noise.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 var s=ac.createBufferSource(),a=ac.createGain(),h=ac.createBiquadFilter();h.type='highpass';h.frequency.value=7000;s.buffer=noise;a.gain.setValueAtTime(.12,t0);a.gain.exponentialRampToValueAtTime(.001,t0+.05);s.connect(h);h.connect(a);a.connect(ac.destination);s.start(t0)}
function sched(){var sp=60/132/4;while(nxt<ac.currentTime+.15){var i=step%16;
  if(i%4===0)kick(nxt);if(i%4===2)hat(nxt);if(BASS[i])tone(BASS[i],nxt,sp*1.6,'sawtooth',.14);if(LEAD[i])tone(LEAD[i],nxt,sp*1.2,'square',.05);
  nxt+=sp;step++}}
function play(){if(!mOn)return;if(own){own.play&&own.play();return}if(!ac||tm)return;nxt=ac.currentTime+.05;step=0;tm=setInterval(sched,40)}
function stopM(){if(tm){clearInterval(tm);tm=null}if(own)own.pause()}
var mt=document.getElementById('mt');
mt.addEventListener('click',function(){mOn=!mOn;mt.textContent='Music: '+(mOn?'on':'off');mt.setAttribute('aria-pressed',mOn);if(mOn){audioOn();if(st==='play')play()}else stopM()});
document.getElementById('mf').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;stopM();
 if(own)own.pause();own=new Audio(URL.createObjectURL(f));own.loop=true;if(mOn&&st==='play')own.play()});
addEventListener('keydown',function(e){
 if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();jump()}
 else if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();duck=true}});
addEventListener('keyup',function(e){if(e.key==='ArrowDown'||e.key==='s')duck=false});
cv.addEventListener('pointerdown',jump);
document.getElementById('jump').addEventListener('pointerdown',function(e){e.preventDefault();jump()});
var db=document.getElementById('duck');
db.addEventListener('pointerdown',function(e){e.preventDefault();duck=true});
['pointerup','pointerleave','pointercancel'].forEach(function(n){db.addEventListener(n,function(){duck=false})});
reset();last=performance.now();requestAnimationFrame(loop);
})();
