<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Ask sai harshith</title>
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --text: #1c2030;
    --muted: #6b7185;
    --accent: #4f46e5;
    --accent-text: #ffffff;
    --bot-bubble: #ffffff;
    --user-bubble: #4f46e5;
    --border: #e3e6ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141c;
      --surface: #1b1e29;
      --text: #eceef6;
      --muted: #9097ad;
      --accent: #8b85ff;
      --accent-text: #12141c;
      --bot-bubble: #232736;
      --user-bubble: #8b85ff;
      --border: #2d3244;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .chat {
    width: 100%;
    max-width: 720px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bot { background: var(--bot-bubble); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: var(--user-bubble); color: var(--accent-text); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
  .chip {
    padding: 8px 14px;
    font-weight: 500;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  input {
    flex: 1;
    padding: 12px 14px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    padding: 0 18px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 0 0 calc(10px + env(safe-area-inset-bottom, 0px));
  }
</style>
</head>
<body>
<main class="chat">
  <header>Ask sai harshith</header>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips">
    <button type="button" class="chip">How do we handle this?</button>
    <button type="button" class="chip">Where do I find the template?</button>
    <button type="button" class="chip">What's our policy on this?</button>
  </div>
  <form id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Type your message" aria-label="Message">
    <button type="submit">Send</button>
  </form>
  <footer>Powered by MindPal</footer>
</main>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');

  function addMessage(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  // Replace this function to connect a real AI backend.
  async function getReply(userText) {
    return "Thanks for your question. This page is a standalone copy of the chat interface, so connect your docs and a backend in getReply() to get real answers.";
  }

  addMessage("Hi! Ask me how we do things here. I answer from our own docs and processes.", 'bot');

  async function send(text) {
    addMessage(text, 'user');
    document.getElementById('chips').hidden = true;
    try {
      addMessage(await getReply(text), 'bot');
    } catch (err) {
      addMessage("Something went wrong. Please try again.", 'bot');
    }
  }

  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => send(c.textContent)));

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    send(text);
  });
</script>
</body>
</html>
